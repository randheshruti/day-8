
{% extends "base.html" %}

{% block content %}

<section class="hero">
    <h1>Welcome to My Blog</h1>
    <p>Explore articles about Python, Flask and Web Development.</p>
</section>

<h2 class="section-title">Latest Posts</h2>

<div class="grid">
    {% for post in posts %}
    <div class="post">
        <h2>{{ post.title }}</h2>
        <p>{{ post.content }}</p>

        <a class="read-more"
           href="{{ url_for('post_detail', post_id=post.id) }}">
            Read More →
        </a>
    </div>
    {% endfor %}
</div>

{% endblock %}
