
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Responsive Blog</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
    <nav>
        <a class="logo" href="/">My Blog</a>

        <button id="menuButton" aria-expanded="false">
            ☰ Menu
        </button>

        <div id="navLinks">
            <a href="/">Home</a>
        </div>
    </nav>
</header>

<main class="container">
    {% block content %}{% endblock %}
</main>

<footer>
    <p>© 2026 My Responsive Blog</p>
</footer>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
